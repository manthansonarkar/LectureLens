[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lecturelens"
version = "1.0.0"
description = "Intelligent YouTube lecture slide & page extractor with adaptive deduplication, scroll overlap control, OCR, transcript alignment, and PDF/DOCX notes export."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Manthan Sonarkar" }
]
keywords = [
  "youtube",
  "lecture-notes",
  "slide-extractor",
  "ocr",
  "pdf",
  "docx",
  "computer-vision",
  "education",
  "study-tools",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sse-starlette>=2.1.0",
  "yt-dlp>=2025.1.15",
  "numpy>=1.26.0",
  "pillow>=10.4.0",
  "opencv-python-headless>=4.10.0",
  "reportlab>=4.2.0",
  "python-docx>=1.1.2",
  "pydantic>=2.9.0",
  "rich>=13.9.0",
  "typer>=0.12.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ocr = [
  "rapidocr-onnxruntime>=1.2.0",
]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
lecturelens = "lecturelens.cli:app"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
lecturelens = ["static/**/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
